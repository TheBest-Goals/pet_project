services:
  postgres:
    image: postgres:16-alpine
    container_name: rbx_postgres
    environment:
      POSTGRES_DB: db_rbShop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "2019"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: rbx_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_rbShop
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "2019"
    depends_on:
      - postgres

volumes:
  postgres_data: